# Docker Compose configuration for SecureChain Hyperledger Fabric network
# This file defines the services for the HotelOrg network with 1 peer and 1 orderer

version: '3.8'

services:
  # CA for Orderer organization
  ca-orderer:
    image: hyperledger/fabric-ca:1.5.7
    container_name: ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.crt
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/ca.key
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/ordererOrganizations/securechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - securechain

  # CA for HotelOrg organization
  ca-hotelorg:
    image: hyperledger/fabric-ca:1.5.7
    container_name: ca-hotelorg
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hotelorg
      - FABRIC_CA_SERVER_PORT=7055
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.crt
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/ca.key
    ports:
      - "7055:7055"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/hotelorg.securechain.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - securechain

  # Orderer node
  orderer.securechain.com:
    image: hyperledger/fabric-orderer:2.4.7
    container_name: orderer.securechain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_KAFKA_TOPIC_REPLICATIONFACTOR=1
      - ORDERER_KAFKA_VERBOSE=true
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ./crypto-config/ordererOrganizations/securechain.com/orderers/orderer.securechain.com/:/var/hyperledger/orderer
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
    networks:
      - securechain
    depends_on:
      - ca-orderer

  # CouchDB for peer0.hotelorg
  couchdb-hotelorg:
    image: couchdb:3.3.1
    container_name: couchdb-hotelorg
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - securechain

  # Peer node for HotelOrg
  peer0.hotelorg.securechain.com:
    image: hyperledger/fabric-peer:2.4.7
    container_name: peer0.hotelorg.securechain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.hotelorg.securechain.com
      - CORE_PEER_ADDRESS=peer0.hotelorg.securechain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hotelorg.securechain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hotelorg.securechain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hotelorg.securechain.com:7051
      - CORE_PEER_LOCALMSPID=HotelOrgMSP
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securechain_securechain
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=couchdb
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-hotelorg:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_MAXRETRY=3
      - CORE_LEDGER_STATE_COUCHDBCONFIG_RETRYINTERVAL=3s
      - CORE_CHAINCODE_LOGGING_LEVEL=DEBUG
      - CORE_CHAINCODE_LOGGING_SHIM=DEBUG
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - CORE_METRICS_PROVIDER=prometheus
    ports:
      - "7051:7051"
      - "9443:9443"
    volumes:
      - ./crypto-config/peerOrganizations/hotelorg.securechain.com/peers/peer0.hotelorg.securechain.com/:/etc/hyperledger/fabric
      - /var/run/docker.sock:/host/var/run/docker.sock
    networks:
      - securechain
    depends_on:
      - ca-hotelorg
      - couchdb-hotelorg

  # CLI container for network operations
  cli:
    image: hyperledger/fabric-tools:2.4.7
    container_name: cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.hotelorg.securechain.com:7051
      - CORE_PEER_LOCALMSPID=HotelOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hotelorg.securechain.com/peers/peer0.hotelorg.securechain.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hotelorg.securechain.com/peers/peer0.hotelorg.securechain.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hotelorg.securechain.com/peers/peer0.hotelorg.securechain.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hotelorg.securechain.com/users/Admin@hotelorg.securechain.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ./chaincode:/opt/gopath/src/github.com/chaincode
      - /var/run/docker.sock:/host/var/run/docker.sock
    networks:
      - securechain
    depends_on:
      - peer0.hotelorg.securechain.com
      - orderer.securechain.com

networks:
  securechain:
    name: securechain
    driver: bridge
